{% extends 'tienda/index.html' %}

{% block title %}
  🛒 Eliminar {{ order.id }}
{% endblock %}
{% block content %}
  <h1>Cancelar pedido # {{ order.id }} </h1>
  <p>¿Estás seguro de que quieres eliminar este Pedido?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
  </form>
  

  <a href="{% url 'tienda:order_detail' pk=order.pk %}">Cancelar</a>
{% endblock %}
