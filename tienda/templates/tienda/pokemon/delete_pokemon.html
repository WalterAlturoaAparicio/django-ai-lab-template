{% extends 'tienda/index.html' %}

{% block title %}
  🛒 Eliminar {{ pokemon.nombre }}
{% endblock %}
{% block content %}
  <h1>Eliminar Pokémon {{ pokemon.nombre }} {{ pokemon.id }}</h1>
  <p>¿Estás seguro de que quieres eliminar este Pokémon?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
  </form>
  

  <a href="{% url 'tienda:pokemon_detail' pk=pokemon.pk %}">Cancelar</a>
{% endblock %}
