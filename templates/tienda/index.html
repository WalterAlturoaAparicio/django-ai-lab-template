<!DOCTYPE html>
<html>
<head>
    <title>Tienda Pokémon</title>
    <style>
        body { font-family: Arial; text-align: center; }
        .pokemon { 
            display: inline-block; 
            border: 1px solid #ccc; 
            padding: 15px; 
            margin: 10px; 
            border-radius: 10px;
            width: 200px;
        }
        img { width: 100px; }
        button {
            background: #ffcc00;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>🛒 Tienda Pokémon</h1>

    {% for pokemon in pokemons %}
        <div class="pokemon">
            <h3>{{ pokemon.nombre }}</h3>
            <img src="{{ pokemon.imagen }}" alt="{{ pokemon.nombre }}">
            <p>Precio: ${{ pokemon.precio }}</p>
            <button>Comprar</button>
        </div>
    {% endfor %}

</body>
</html>
