{% extends 'tienda/index.html' %}

{% block title %}
  🛒 Pokemon # {{ pokemon.pk }}
{% endblock %}
{% block content %}
  <h1>🛒 Tienda Pokémon</h1>
    <div class="pokemon">
      <h3>{{ pokemon.nombre }}</h3>
      <img src="{{ pokemon.imagen }}" alt="{{ pokemon.nombre }}" />
      <p>Precio: ${{ pokemon.precio }}</p>
      <button>Comprar</button>
    </div>
{% endblock %}
